<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SGR La Serena - Recuperar Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow-sm border-0" style="width: 100%; max-width: 420px;">
        <div class="card-header bg-primary text-white text-center py-3">
            <h5 class="mb-0 fw-bold">Recuperar Contraseña</h5>
            <small>Código de Verificación Temporal</small>
        </div>
        <div class="card-body p-4">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} small mb-3">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    {{ form.email.label_tag }}
                    {{ form.email }}
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold">Enviar Código</button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'login' %}" class="text-muted small text-decoration-none">← Volver al Login</a>
            </div>
        </div>
    </div>
</body>
</html>
