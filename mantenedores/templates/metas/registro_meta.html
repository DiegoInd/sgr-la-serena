<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGR La Serena - Registro de Metas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">SGR La Serena - Sistema de Gestión</a>
            <span class="navbar-text text-white">
                Usuario: <strong>Funcionario</strong> | Perfil: <strong>Mantenedores</strong>
            </span>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row g-4">
            <div class="col-md-5">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white fw-bold text-primary">
                        Registrar Nueva Meta (RF-01 / HU-02)
                    </div>
                    <div class="card-body">
                        <form>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Cargo o Usuario Responsable</label>
                                <input type="text" class="form-control" placeholder="Ej: Analista de Atención" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Período Evaluativo</label>
                                <select class="form-select">
                                    <option selected>Seleccione Período...</option>
                                    <option>2026 - Trimestre 1 (01/01/2026 - 31/03/2026)</option>
                                    <option>2026 - Trimestre 2 (01/04/2026 - 30/06/2026)</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Ponderación (%)</label>
                                <input type="number" class="form-control" min="1" max="100" placeholder="Ej: 25">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Descripción de la Meta</label>
                                <textarea class="form-control" rows="3" placeholder="Describa el objetivo asignado..."></textarea>
                            </div>
                            <button type="button" class="btn btn-primary w-100 fw-bold">Guardar Meta</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white fw-bold text-primary">
                        Metas y Ponderaciones Asignadas
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Cargo / Usuario</th>
                                    <th>Período</th>
                                    <th>Ponderación</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Atención al Vecino</td>
                                    <td>2026 - T1</td>
                                    <td><span class="badge bg-success">30%</span></td>
                                    <td><button class="btn btn-sm btn-outline-secondary">Editar</button></td>
                                </tr>
                                <tr>
                                    <td>Coordinador de Terreno</td>
                                    <td>2026 - T1</td>
                                    <td><span class="badge bg-primary">40%</span></td>
                                    <td><button class="btn btn-sm btn-outline-secondary">Editar</button></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
